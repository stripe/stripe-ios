name: Dead code detection
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  push:
    branches: [master]

concurrency:
  group: dead-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dead-code-check:
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select revisions and check changed files
        id: scope
        run: ruby ci_scripts/dead_code/prepare_scan.rb

      - name: Setup Xcode
        if: steps.scope.outputs.required == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Fingerprint scan inputs
        id: fingerprint
        if: steps.scope.outputs.required == 'true'
        run: ruby ci_scripts/dead_code/prepare_scan.rb fingerprint

      # Cache parsed findings only. Exact SHA/toolchain/recipe keys prevent stale
      # comparisons, and master push results are available to every PR.
      - name: Restore current scan
        id: current-cache
        if: steps.scope.outputs.required == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dead-code-cache
          key: dead-code-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.fingerprint.outputs.toolchain }}-${{ steps.fingerprint.outputs.recipe }}-${{ steps.scope.outputs.source }}

      - name: Scan current revision
        if: steps.scope.outputs.required == 'true' && steps.current-cache.outputs.cache-hit != 'true'
        env:
          SOURCE_SHA: ${{ steps.scope.outputs.source }}
        run: ruby ci_scripts/dead_code/run_scan.rb "$SOURCE_SHA" "$RUNNER_TEMP/dead-code-cache/findings.json"

      - name: Save current scan
        if: steps.scope.outputs.required == 'true' && steps.current-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dead-code-cache
          key: ${{ steps.current-cache.outputs.cache-primary-key }}

      - name: Keep current findings and clear cache directory
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/dead-code-results"
          cp "$RUNNER_TEMP/dead-code-cache/findings.json" "$RUNNER_TEMP/dead-code-results/current.json"
          rm -rf "$RUNNER_TEMP/dead-code-cache"

      # Use the same path for both restores: GitHub includes paths in cache versions.
      - name: Restore baseline scan
        id: baseline-cache
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dead-code-cache
          key: dead-code-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.fingerprint.outputs.toolchain }}-${{ steps.fingerprint.outputs.recipe }}-${{ steps.scope.outputs.baseline }}

      - name: Scan baseline revision
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.baseline }}
        run: ruby ci_scripts/dead_code/run_scan.rb "$BASE_SHA" "$RUNNER_TEMP/dead-code-cache/findings.json"

      - name: Save baseline scan
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dead-code-cache
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}

      - name: Compare unused code
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: |
          ruby ci_scripts/dead_code/compare_unused_code.rb "$RUNNER_TEMP/dead-code-cache/findings.json" "$RUNNER_TEMP/dead-code-results/current.json"
          if [ -s new_dead_code.txt ]; then
            delimiter="DEAD_CODE_$(uuidgen)"
            {
              echo "diff<<$delimiter"
              cat new_dead_code.txt
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          fi

      - uses: davidme-stripe/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find_comment
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '[find-dead-code]'

      - uses: davidme-stripe/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        id: create_update_comment
        if: env.diff != '' && !contains(github.event.pull_request.labels.*.name, 'skip dead code check')
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚨 New dead code detected in this PR:

            ```diff
            ${{ env.diff }}
            ```

            Please remove the dead code before merging.

            If this is intentional, you can bypass this check by adding the label `skip dead code check` to this PR.

            ℹ️ If this comment appears to be left in error, double check that the flagged code is actually used and/or make sure your branch is up-to-date with `master`.

            [find-dead-code]

          edit-mode: replace
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: davidme-stripe/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        id: create_update_comment_ignored
        if: env.diff != '' && contains(github.event.pull_request.labels.*.name, 'skip dead code check')
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ⚠️  New dead code detected in this PR but ignored:

            ```diff
            ${{ env.diff }}
            ```

            This dead code check has been bypassed with the `skip dead code check` label.

            ℹ️ If this comment appears to be left in error, double check that the flagged code is actually used and/or make sure your branch is up-to-date with `master`.

            [find-dead-code]

          edit-mode: replace
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: davidme-stripe/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        id: resolve_comment
        if: env.diff == '' && steps.find_comment.outputs.comment-id != ''
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Dead code has been resolved in this PR.

            [find-dead-code]

          edit-mode: replace
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if not acknowledged
        if: env.diff != '' && !contains(github.event.pull_request.labels.*.name, 'skip dead code check')
        run: exit 1
