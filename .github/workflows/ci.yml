name: CI

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed canary commit
        required: true
        type: string

permissions: {}

jobs:
  authority-metadata:
    if: github.repository == 'stripe/stripe-ios' && github.ref == 'refs/heads/assessment/ios-vercel-authority-20261118-7d4a63' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read Vercel authority metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SNAPSHOT_PROJECT_ID: ${{ secrets.VERCEL_SNAPSHOT_PROJECT_ID }}
        run: node .github/assessment/ios-vercel-authority.mjs
