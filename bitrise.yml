format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map: []
app:
  envs:
  - CACHE_BENCH_BASE: 675cd129bff8b7a0fdec0ffb9c2287f010d0bc38
pipelines:
  size-cache-transport-benchmark:
    workflows:
      baseline-producer:
        parallel: 3
      cached-consumer:
        depends_on:
        - baseline-producer
workflows:
  prepare-benchmark:
    steps:
    - git-clone@8.5.1:
        inputs:
        - merge_pr: "no"
        - clone_depth: "2"
        - ignore_branch_for_commit_fetch: "yes"
        - pull_request_head_branch: ""
        - pull_request_repository_url: ""
    - script@1:
        title: Configure Bundler and fetch exact baseline
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            bundle config set path 'vendor/bundle'
            git fetch --no-tags --depth=1 origin "$CACHE_BENCH_BASE"
            git diff --exit-code "$CACHE_BENCH_BASE" HEAD -- Tests/installation_tests/size_test ci_scripts/size_report_cache.rb Gemfile.lock modules.yaml
    - restore-cache@2.4.1:
        inputs:
        - key: bundle-cache-{{ checksum "Gemfile.lock" }}
    - bundler@0: {}
    - script@1:
        title: Prepare isolated transport keys
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            ruby -I. -r./ci_scripts/size_report_cache - <<'RUBY'
            cache = SizeReportCache.new
            pipeline = ENV.fetch('BITRISEIO_PIPELINE_ID')
            baseline = ENV.fetch('CACHE_BENCH_BASE')
            key = "size-benchmark-#{pipeline}-#{baseline}-#{cache.fingerprint}"
            {
              'SIZE_REPORT_FINGERPRINT' => cache.fingerprint,
              'CACHE_BENCH_KEY' => key,
              'CACHE_BENCH_HEAD' => CIBranch.git('rev-parse', 'HEAD')
            }.each do |name, value|
              abort "Failed to export #{name}" unless system('envman', 'add', '--key', name, '--value', value)
            end
            puts "CACHE_BENCH fingerprint=#{cache.fingerprint} baseline=#{baseline} key=#{key}"
            RUBY
  baseline-producer:
    before_run:
    - prepare-benchmark
    steps:
    - script@1:
        title: Build one baseline SDK for this cache bucket
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            ruby -I. -r./ci_scripts/size_report_cache - <<'RUBY'
            index = Integer(ENV.fetch('BITRISE_IO_PARALLEL_INDEX'))
            abort 'Expected three producer workers' unless Integer(ENV.fetch('BITRISE_IO_PARALLEL_TOTAL')) == 3
            sdk = %w[StripeCryptoOnramp StripePayments StripePaymentsUI].fetch(index)
            cache = SizeReportCache.new
            abort 'SDK is assigned to a different production bucket' unless cache.shard(sdk) == index
            baseline = ENV.fetch('CACHE_BENCH_BASE')
            path = File.expand_path(File.dirname(cache.path(baseline, sdk)))
            {
              'CACHE_BENCH_SDK' => sdk,
              'CACHE_BENCH_SAVE_PATH' => path,
              'CACHE_BENCH_SAVE_KEY' => "#{ENV.fetch('CACHE_BENCH_KEY')}-#{index}"
            }.each do |name, value|
              abort "Failed to export #{name}" unless system('envman', 'add', '--key', name, '--value', value)
            end
            puts "CACHE_BENCH producer shard=#{index} sdk=#{sdk} path=#{path}"
            RUBY
    - script@1:
        title: Measure and verify exact baseline
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            started=$(date +%s)
            /usr/bin/time -p bundle exec ruby Tests/installation_tests/size_test/size_report.rb "$CACHE_BENCH_BASE" "$CACHE_BENCH_BASE" --modules "$CACHE_BENCH_SDK" 2>&1 | tee "$BITRISE_DEPLOY_DIR/size-producer.log"
            echo "CACHE_BENCH producer_seconds=$(( $(date +%s) - started )) sdk=$CACHE_BENCH_SDK"
            ruby -I. -r./ci_scripts/size_report_cache - <<'RUBY'
            cache = SizeReportCache.new
            sdk = ENV.fetch('CACHE_BENCH_SDK')
            sizes = cache.read(ENV.fetch('CACHE_BENCH_BASE'), sdk)
            abort 'Producer did not write a valid measurement' unless sizes
            puts "CACHE_BENCH producer_valid sdk=#{sdk} raw_app_kb=#{sizes.inspect}"
            RUBY
    - save-cache@1.5.2:
        is_skippable: false
        inputs:
        - key: $CACHE_BENCH_SAVE_KEY
        - paths: $CACHE_BENCH_SAVE_PATH
        - compression_level: "1"
    - deploy-to-bitrise-io@2:
        is_always_run: true
    meta:
      bitrise.io:
        stack: osx-xcode-26.4.x
        machine_type_id: g2.mac.large
  cached-consumer:
    before_run:
    - prepare-benchmark
    steps:
    - restore-cache@2.4.1:
        is_skippable: false
        inputs:
        - key: $CACHE_BENCH_KEY-0
    - restore-cache@2.4.1:
        is_skippable: false
        inputs:
        - key: $CACHE_BENCH_KEY-1
    - restore-cache@2.4.1:
        is_skippable: false
        inputs:
        - key: $CACHE_BENCH_KEY-2
    - script@1:
        title: Verify all three baseline archives
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            ruby -I. -r./ci_scripts/size_report_cache - <<'RUBY'
            cache = SizeReportCache.new
            %w[StripeCryptoOnramp StripePayments StripePaymentsUI].each do |sdk|
              sizes = cache.read(ENV.fetch('CACHE_BENCH_BASE'), sdk)
              abort "Missing transported baseline for #{sdk}" unless sizes
              puts "CACHE_BENCH restored_valid sdk=#{sdk} shard=#{cache.shard(sdk)} raw_app_kb=#{sizes.inspect}"
            end
            RUBY
    - script@1:
        title: Build head SDKs and reuse transported baselines
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            started=$(date +%s)
            /usr/bin/time -p bundle exec ruby Tests/installation_tests/size_test/size_report.rb "$CACHE_BENCH_HEAD" "$CACHE_BENCH_BASE" --modules StripeCryptoOnramp,StripePayments,StripePaymentsUI 2>&1 | tee "$BITRISE_DEPLOY_DIR/size-consumer.log"
            echo "CACHE_BENCH consumer_seconds=$(( $(date +%s) - started ))"
            ruby -I. -r./ci_scripts/size_report_cache - <<'RUBY'
            log = File.read(File.join(ENV.fetch('BITRISE_DEPLOY_DIR'), 'size-consumer.log'))
            cache = SizeReportCache.new
            baseline = ENV.fetch('CACHE_BENCH_BASE')
            head = ENV.fetch('CACHE_BENCH_HEAD')
            abort 'Benchmark head must differ from baseline' if head == baseline
            %w[StripeCryptoOnramp StripePayments StripePaymentsUI].each do |sdk|
              abort "No cached baseline use for #{sdk}" unless log.include?("Using cached baseline for #{sdk} at #{baseline}")
              abort "No fresh head measurement for #{sdk}" unless cache.read(head, sdk)
              puts "CACHE_BENCH consumer_pass sdk=#{sdk} baseline_hit=true head_built=true"
            end
            abort 'Unexpected baseline rebuild' if log.include?('Baseline cache miss;')
            puts 'CACHE_BENCH consumer_success baseline_hits=3 head_builds=3 baseline_builds=0'
            RUBY
    - deploy-to-bitrise-io@2:
        is_always_run: true
    meta:
      bitrise.io:
        stack: osx-xcode-26.4.x
        machine_type_id: g2.mac.large
